<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>双人票 · 首页圆形双入口 · 效果图</title>
<style>
  :root{
    --bg:#0B0E14;
    --text-hi:#ffffff; --text-mid:#b3b3b3; --text-low:#7a7a7a;
    --accent:#2997ff; --accent-deep:#0071e3;
    --warn:#ffa42b;
    --r-card:26px;
    --glass:rgba(255,255,255,.06);
    --glass-border:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text-hi);
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
    overflow:hidden; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* 环境色团 —— 取自 app 主题 AmbientBlue / Magenta / Teal */
  .blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
  .blob.b1{width:420px;height:420px;left:-130px;top:-90px;background:#2B4D80;opacity:.55}
  .blob.b2{width:380px;height:380px;right:-140px;top:38%;background:#6B2F60;opacity:.42}
  .blob.b3{width:360px;height:360px;left:24%;bottom:-120px;background:#1E5C53;opacity:.34}
  /* 点阵底纹 —— 与真机首页一致 */
  .dots{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.2px);
    background-size:22px 22px;
  }
  .notch{
    position:fixed;top:9px;left:50%;transform:translateX(-50%);
    width:112px;height:26px;background:#000;border-radius:999px;z-index:6;
  }
  .screen{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;padding:0 20px;
  }

  /* 状态栏 */
  .status{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 8px 4px;font-size:13px;font-weight:600;letter-spacing:.02em;
  }
  .status .icons{display:flex;gap:7px;align-items:center;opacity:.92}
  .status svg{display:block}

  /* 头部 */
  header{padding:16px 6px 0}
  h1{font-size:26px;font-weight:700;line-height:1.25}
  .sub{margin-top:7px;font-size:13.5px;line-height:1.55;color:var(--text-mid)}

  /* 信息卡 —— 玻璃 */
  .card{
    margin-top:16px;
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:var(--r-card);
    padding:12px 16px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13.5px}
  .row + .row{border-top:1px solid rgba(255,255,255,.06)}
  .row .k{color:var(--text-mid)}
  .row .v{color:var(--text-hi);font-weight:600}

  /* 中央圆形双入口 */
  .stage{
    flex:1;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;
  }
  .entry{
    display:flex;flex-direction:column;align-items:center;gap:9px;
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
    transition:transform .16s cubic-bezier(.32,2.32,.61,.27);
  }
  .entry:active{transform:scale(.93)}
  .circle{
    width:124px;height:124px;border-radius:50%;
    display:grid;place-items:center;
  }
  .circle svg{width:42px;height:42px}
  .circle.primary{
    background:linear-gradient(160deg,#3aa2ff 0%,var(--accent-deep) 100%);
    box-shadow:0 14px 34px rgba(0,113,227,.45),
               inset 0 1px 0 rgba(255,255,255,.35);
    color:#fff;
  }
  .circle.ghost{
    background:var(--glass);
    border:1.5px solid rgba(255,255,255,.17);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:var(--accent);
  }
  .meta{display:flex;flex-direction:column;align-items:center;gap:1px}
  .tag{font-size:10.5px;letter-spacing:.14em;color:var(--text-low)}
  .label{font-size:16.5px;font-weight:650;color:var(--text-hi)}

  /* 底部：警示条 + 设置 */
  .bottom{
    display:flex;flex-direction:column;align-items:center;gap:13px;
    padding-bottom:14px;
  }
  .chip-warn{
    font-size:11.5px;color:var(--warn);
    background:rgba(255,164,43,.13);border:1px solid rgba(255,164,43,.32);
    border-radius:999px;padding:5px 13px;
  }
  .settings{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
    transition:transform .16s cubic-bezier(.32,2.32,.61,.27);
  }
  .settings:active{transform:scale(.92)}
  .settings .ring{
    width:58px;height:58px;border-radius:50%;
    background:var(--glass);border:1.5px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    display:grid;place-items:center;color:var(--text-hi);
  }
  .settings .ring svg{width:23px;height:23px}
  .settings .cap{font-size:12px;color:var(--text-mid);font-weight:500}
  .homebar{
    width:118px;height:5px;border-radius:3px;
    background:rgba(255,255,255,.38);margin:0 auto;
  }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="dots"></div>
<div class="notch"></div>

<div class="screen">
  <!-- 状态栏 -->
  <div class="status">
    <span>21:05</span>
    <span class="icons">
      <svg width="17" height="12" viewBox="0 01712" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="6" width="3" height="6" rx="1"/><rect x="9" y="3.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="1" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 01612" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M1.54.5a9.59.5 0 0 113 0"/><path d="M47.5a66.6 0 0 17 0"/><path d="M6.810.2a33.3 0 0 12.4 0"/><circle cx="8" cy="11.2" r="1.1" fill="#fff" stroke="none"/></svg>
      <svg width="24" height="12" viewBox="0 02412" fill="none"><rect x=".7" y=".7" width="19" height="10.6" rx="3" stroke="#fff" stroke-opacity=".5"/><rect x="2.2" y="2.2" width="14" height="7.6" rx="1.8" fill="#fff"/><path d="M21.54.2v3.6c1 .35 1.51 1 1.51 1.8s-.51.45-1.51 1.8z" fill="#fff" fill-opacity=".5"/></svg>
    </span>
  </div>

  <!-- 头部 -->
  <header>
    <h1>分享你的手机</h1>
    <p class="sub">最多 1 位朋友实时观看，并且能和你连麦说话。</p>
  </header>

  <!-- 当前画质信息卡 -->
  <div class="card">
    <div class="row"><span class="k">分享画质</span><span class="v">720p · 30 帧 · 2.0 Mbps</span></div>
    <div class="row"><span class="k">流量上限</span><span class="v">约 15 MB/分钟</span></div>
    <div class="row"><span class="k">麦克风</span><span class="v">开</span></div>
    <div class="row"><span class="k">上次连接</span><span class="v">09-23 01:39</span></div>
  </div>

  <!-- 中央：上下两个圆形入口 -->
  <div class="stage">
    <div class="entry" role="button" aria-label="开始分享">
      <div class="circle primary">
        <svg viewBox="0 02424" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="3.5" width="19" height="13.5" rx="2.5"/>
          <path d="M12 13.8V7.2"/>
          <path d="M9.4 9.8 12 7.2l2.6 2.6"/>
          <path d="M8.520.5h7"/>
        </svg>
      </div>
      <div class="meta">
        <span class="tag">分享端</span>
        <span class="label">开始分享</span>
      </div>
    </div>

    <div class="entry" role="button" aria-label="以观众进入">
      <div class="circle ghost">
        <svg viewBox="0 02424" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-6.510-6.5S221222 12s3.66.5-106.5S212212z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <div class="meta">
        <span class="tag">观众端</span>
        <span class="label">以观众进入</span>
      </div>
    </div>
  </div>

  <!-- 底部：警示 + 设置 -->
  <div class="bottom">
    <span class="chip-warn">全程需要保持亮屏，锁屏会自动停止</span>
    <div class="settings" role="button" aria-label="分享设置">
      <div class="ring">
        <svg viewBox="0 02424" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </div>
      <span class="cap">设置</span>
    </div>
    <div class="homebar"></div>
  </div>
</div>
<!-- 截图自检用：量出真实 CSS 视口，交付前删掉 -->
<div style="position:fixed;left:6px;bottom:6px;z-index:99;background:#ff0033;color:#fff;font:11px/1.4 monospace;padding:3px 6px;border-radius:4px" id="vp"></div>
<script>document.getElementById('vp').textContent=innerWidth+'x'+innerHeight+' dpr='+devicePixelRatio;</script>
</body>
</html>
