<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>双人票 · 观看</title>
<style>
:root{
  --surface-0:#121212; --surface-1:#181818; --surface-2:#1f1f1f;
  --text-hi:#fff; --text-mid:#b3b3b3; --text-low:#7a7a7a;
  --accent:#2997ff; --live:#1ed760; --err:#f3727f; --warn:#ffa42b;
  --scrim:rgba(0,0,0,.60);
  --r-lg:16px; --r-card:26px; --pill:9999px; --ctl:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{color:var(--text-hi);overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
/* 舞台用 fixed + inset:0，**不要**再用 height:100vh。
   移动端 100vh 量的是"不含地址栏"的大视口：手机上是 3200 物理像素的屏却给出
   ~2900 的可见高度，视频框因此比看得见的一块高，画面上下各被切掉一截，
   而 body{overflow:hidden} 把这件事变得完全看不出来（没有滚动条可看）。
   fixed 元素直接对齐视口，浏览器外壳收起/展开时会自动跟着变。 */
#stage{position:fixed;inset:0;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
/* 环境底（ambient）：电脑/平板上打开链接，一块竖屏画面居中，左右剩下大片死黑 ——
   "打开默认就是全屏播放，效果很不好"说的就是这一刻。把**同一条流**再画一层、
   放大铺满 + 模糊 + 压暗垫在后面，黑边变成画面自身的余晖，居中的那块再收个圆角，
   就是主流播放器处理窄内容通用的那套。
   手机上刻意不开：整屏 blur 是 GPU 活，观众这边同时在解码一路 WebRTC，
   为审美吃掉帧率不划算，而且窄屏本来就没剩下多少黑边。 */
#vbg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;
  filter:blur(42px) saturate(1.4) brightness(.5);background:#000;
  opacity:0;transition:opacity .45s ease;pointer-events:none}
#stage.ambient{display:flex;align-items:center;justify-content:center;background:#08080a}
#stage.ambient #vbg{opacity:1}
#stage.ambient #v{position:relative;width:auto;height:auto;max-width:96%;max-height:92%;
  border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
/* 浮层：视频区之上只能用 scrim —— SurfaceView/原生视频内容抓不到，玻璃盖不上去 */
.overlay{position:absolute;left:12px;right:12px;z-index:5}
/* 本地播放层：盖住屏幕流，但**不销毁**它 —— 撤层时要能立刻退回来看屏幕 */
#lv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:3}
#lvBadge{position:absolute;right:12px;top:14px;z-index:6;font-size:11px;padding:6px 11px;
  border-radius:var(--pill);background:var(--scrim);backdrop-filter:blur(10px);color:var(--text-mid)}
#lvBadge b{color:var(--live);font-weight:640}
.top{top:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--pill);
  background:var(--scrim);font-size:12.5px;backdrop-filter:blur(10px)}
.top .live{display:inline-flex;align-items:center;gap:6px;color:var(--live)}
.top .live i{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(30,215,96,.2)}
.top .g{margin-left:auto;color:var(--text-mid)}
.bottom{bottom:20px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--pill);
  background:var(--scrim);justify-content:center;margin:0 auto;width:max-content;max-width:100%;
  backdrop-filter:blur(10px)}
.ctl{width:var(--ctl);height:var(--ctl);border-radius:var(--pill);display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.14);color:#fff;cursor:pointer;flex:none;
  transition:transform .12s cubic-bezier(.32,2.32,.61,.27),background .12s}
.ctl:active{transform:scale(.90,1.06)}
.ctl.on{background:#fff;color:#0a0a0a}
.ctl.mic-live{background:var(--live);color:#04160a}
.ctl svg{width:22px;height:22px}
.stat{display:flex;flex-direction:column;font-size:10.5px;color:var(--text-mid);line-height:1.25}
.stat b{font-size:12.5px;color:#fff;font-weight:640}
.sep{width:1px;height:26px;background:rgba(255,255,255,.18)}
/* 同看条：房主播放器的只读镜像，压在控制岛上方（控制岛占 20..82px，故 bottom:90）。
   和 .bottom 一样用 width:max-content + margin:0 auto 收成一颗药丸，别拉满整幅压住画面。 */
.watch{bottom:90px;display:flex;flex-direction:column;gap:6px;padding:9px 12px;border-radius:var(--r-lg);
  background:var(--scrim);width:max-content;max-width:100%;margin:0 auto;backdrop-filter:blur(10px)}
.watch .line1,.watch .line2{display:flex;align-items:center;gap:8px}
#wTitle{font-size:12px;color:var(--text-hi);max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn{min-width:46px;height:34px;padding:0 10px;border-radius:var(--pill);flex:none;cursor:pointer;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.14);color:#fff;
  font:inherit;font-size:12.5px;font-weight:640;line-height:1;
  transition:transform .12s cubic-bezier(.32,2.32,.61,.27),background .12s}
.wbtn:active{transform:scale(.90,1.06)}
/* 按下去了但进度还没变（要等房主下一次广播）—— 用这一闪代替乐观更新，告诉人"收到了" */
.wbtn.hit{background:#fff;color:#0a0a0a}
/* 不能控制时必须**一眼看出来**，只靠"点了没反应"会被当成卡住。
   写在 .hit 之后，同权重下后来者赢：权限一收，残留的按下高亮立刻让位。 */
.wbtn:disabled{opacity:.36;cursor:default;transform:none;background:rgba(255,255,255,.05);
  color:var(--text-low);border-style:dashed}
.wtime{font-size:11.5px;color:var(--text-mid);white-space:nowrap;font-variant-numeric:tabular-nums}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:6}
.card{background:var(--surface-1);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-card);
  padding:20px;max-width:520px;width:100%;text-align:left;box-shadow:0 10px 28px rgba(0,0,0,.44)}
h1{font-size:20px;margin:0 0 6px}
.muted{color:var(--text-mid);font-size:13.5px;line-height:1.6}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:var(--pill);
  padding:13px 22px;font:inherit;font-weight:650;cursor:pointer;width:100%;margin-top:14px}
.chip{display:inline-flex;gap:5px;align-items:center;font-size:11px;padding:3px 9px;border-radius:var(--pill);
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);color:var(--text-mid);white-space:nowrap}
.chip.ok{color:#9be0ac;background:rgba(30,215,96,.13);border-color:rgba(30,215,96,.3)}
.chip.bad{color:#ffb4bb;background:rgba(243,114,127,.13);border-color:rgba(243,114,127,.32)}
.chip.warn{color:#ffd79a;background:rgba(255,164,43,.13);border-color:rgba(255,164,43,.32)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0;flex-wrap:wrap}
.kv>*{min-width:0}
.hide{display:none!important}
.meter{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.meter i{width:3px;background:var(--live);border-radius:2px}
.steps{font-size:13px;color:var(--text-mid);line-height:1.9}
</style>
</head>
<body>
<div id="stage">
  <!-- 同一条流的后景层：muted 是必须的，否则两份音频会叠出回声 -->
  <video id="vbg" autoplay playsinline muted></video>
  <video id="v" autoplay playsinline></video>
  <!-- 本地播放层（放映厅 S 档）：观众直接播房主递来的片源，画质是原生的。
       它盖在屏幕流上面；放不出来就撤掉这层，退回看对方的屏幕，不留黑屏。 -->
  <video id="lv" class="hide" autoplay playsinline></video>
  <div id="lvBadge" class="hide">本地播放 · <b id="lvRes">—</b></div>

  <div class="overlay top hide" id="topBar">
    <span class="live"><i></i>直连</span>
    <span class="g" id="topRight">等待画面…</span>
  </div>

  <div class="overlay bottom hide" id="ctlBar">
    <button class="ctl" id="btnMic" title="开麦连麦"></button>
    <div class="sep"></div>
    <div class="stat"><b id="sLat">—</b><span id="sNet">—</span></div>
    <div class="sep"></div>
    <div class="stat"><b id="sFps">—</b><span>fps</span></div>
    <div class="sep"></div>
    <button class="ctl" id="btnVol" title="音量"></button>
    <button class="ctl" id="btnPip" title="悬浮小窗"></button>
    <button class="ctl" id="btnFull" title="全屏"></button>
  </div>

  <!-- 同看条：只在房主还在广播时出现（见 JS 里的 WATCH_STALE_MS），所以初始 hide -->
  <div class="overlay watch hide" id="watchBar">
    <div class="line1">
      <span id="wTitle">一起看</span>
      <span class="chip" id="wPerm">仅观看</span>
    </div>
    <div class="line2" id="wKeys">
      <button class="wbtn" id="wBack" title="后退 10 秒">-10</button>
      <button class="wbtn" id="wPlay" title="暂停 / 继续">▶</button>
      <button class="wbtn" id="wFwd" title="前进 10 秒">+10</button>
      <span class="wtime" id="wTime">0:00 / 0:00</span>
    </div>
    <div class="line2 hide" id="wMissing"><span class="wtime">对方还没打开播放器</span></div>
  </div>

  <!-- 放映厅的播放条：只在 S 档（观众本地播同一条片源）时出现。
       和 #watchBar 互斥 —— 屏幕上永远只有一条这样的横条，这就是"一层 UI"。 -->
  <div class="overlay watch hide" id="cineBar">
    <div class="line1">
      <span id="cTitle">一起看</span>
      <span class="chip" id="cPerm">仅观看</span>
    </div>
    <div class="line2">
      <button class="wbtn" id="cBack" title="后退 10 秒">-10</button>
      <button class="wbtn" id="cPlay" title="暂停 / 继续">▶</button>
      <button class="wbtn" id="cFwd" title="前进 10 秒">+10</button>
      <span class="wtime" id="cTime">0:00 / 0:00</span>
      <span class="wtime" id="cDrift" style="opacity:.6"></span>
    </div>
  </div>

  <div class="center" id="panel">
    <div class="card" id="cardBody"></div>
  </div>
</div>

<script>
/*
 * 观众端。与旧版最大的区别：**不再需要把链接发回给房主**。
 *
 * 旧版是"零服务器"——房主把 SDP 塞进链接，观众生成 answer 后还得人肉回传，
 * 一来一回 20–40 秒。现在房主手机里跑着一个传话员（本地 HTTP + WebSocket），
 * 由一条出站隧道挂到公网；这个页面连上那条 WebSocket，双方的 SDP 与候选
 * 就自己来回跑完了。用户只需要点一次链接。
 */

const STUN = [{ urls: [
  'stun:stun.hitv.com:3478',
  'stun:stun.chat.bilibili.com:3478',
  'stun:stun.miwifi.com:3478',
  'stun:stun.l.google.com:19302',
]}];

const ICON = {
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l16 16"/><path d="M9 5a3 3 0 0 1 6 0v5M6 11a6 6 0 0 0 9 5.2M12 17v4"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4h3l4 3V4L7 7H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>',
  mute2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4h3l4 3V4L7 7H4z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>',
  pip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11" width="7" height="6" rx="1.5" fill="currentColor" stroke="none"/></svg>',
  full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>',
};

const $ = id => document.getElementById(id);
const video = $('v');

let ws = null, pc = null, micTrack = null, micOn = false, statsTimer = null;
let gotVideo = false, voiceTimer = null;
/** 远端描述还没就绪时先攒着候选 —— 顺序错了 addIceCandidate 会抛错。 */
let pendingCands = [];
let closedByUs = false;

const KEY = new URLSearchParams(location.search).get('k') || '';

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(html){ $('cardBody').innerHTML = html; $('panel').classList.remove('hide'); }
function hidePanel(){ $('panel').classList.add('hide'); }
function bars(n, color){
  let s = '<span class="meter">';
  for (let i = 0; i < 4; i++) s += `<i style="height:${4+i*3}px;background:${i<n?color:'rgba(255,255,255,.22)'}"></i>`;
  return s + '</span>';
}

function send(obj){
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ---- 连接传话员 --------------------------------------------------------

/* 演示模式：?demo=canvas。它存在的意义是"呈现层能脱离隧道单独检查" ——
   隧道是整条链路上最不稳的一环，连不上房主时就再也看不见观看端长什么样。
   注意 boot() 里的"链接不完整"要在演示模式下让路，否则弹出来的卡片正好
   盖住画面中间，验了个寂寞（headless 截图实测就是这样）。 */
const DEMO = new URLSearchParams(location.search).get('demo') === 'canvas';

function boot(){
  if (!KEY && !DEMO) {
    show(`<h1>这条链接不完整</h1>
      <p class="muted">邀请链接后面的 <code>?k=…</code> 是接入凭证。聊天软件经常把它折成卡片、
      或者只复制了前半截 —— 请让房主重新发一条完整的。</p>`);
    return;
  }
  show(`<h1>正在接入房主的手机…</h1>
    <p class="muted">画面和声音还是直接在两台设备之间传，不经任何中转。</p>
    <div class="row" style="margin-top:12px"><span class="chip" id="stChip">连接中</span></div>`);
  openSocket();
}

function openSocket(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws?k=${encodeURIComponent(KEY)}`;
  try { ws = new WebSocket(url); }
  catch (e) {
    show(`<h1>没能建立连接</h1><p class="muted">${escapeHtml(String(e))}</p>
      <button class="primary" onclick="location.reload()">重试</button>`);
    return;
  }

  ws.onopen = () => { send({ t: 'hello', role: 'viewer' }); };
  ws.onmessage = ev => { onMessage(ev.data); };
  ws.onclose = () => {
    if (closedByUs) return;
    // 通道自己断了 ≠ 连不上。绝大多数就是房主点了「停止分享」（隧道随会话一起没），
    // 以前这里也走 reportFailure，画出来是"纯直连在部分网络下会失败 + 换网络建议"，
    // 把一个正常结束说成了用户的网络故障。
    reportEnded('与房主的连接断了 · 对方可能已停止分享');
  };
  ws.onerror = () => { /* onclose 会跟着触发，统一在那里处理 */ };
}

/** 信令通道此刻是否还开着。ICE 失败时用它分诊：通道都没了，媒体失败是必然结果。 */
function signalingAlive(){ return !!ws && ws.readyState === 1; }

function onMessage(text){
  let m = null;
  try { m = JSON.parse(text); } catch (e) { return; }

  if (m.t === 'offer') startPeer(m.sdp);
  else if (m.t === 'cand') addRemoteCandidate(m);
  else if (m.t === 'bye') { closedByUs = true; reportEnded('房主结束了分享'); }
  else if (m.t === 'watch') onWatch(m.f);
  else if (m.t === 'cinema') onCinema(m.f);
}

// ---- 建立直连 ---------------------------------------------------------

async function startPeer(offerSdp){
  pc = new RTCPeerConnection({ iceServers: STUN, bundlePolicy:'max-bundle', rtcpMuxPolicy:'require' });
  // 调试钩子：模块作用域里的 pc 从外部读不到，量测需要能查连接状态与统计。
  window.t2 = { pc, video, stats: null, fail: null };

  pc.ontrack = ev => {
    // 音频视频都挂到同一个 <video> 上 —— 仅语音模式下声音也要能出来（video 元素可以只播音频）。
    let s = ev.streams[0];
    if (!s) {
      s = (video.srcObject instanceof MediaStream) ? video.srcObject : new MediaStream();
      s.addTrack(ev.track);
    }
    video.srcObject = s;
    // 后景层共用**同一条** MediaStream：不是第二路订阅，不额外耗带宽，
    // 解码也还是那一次，只是多画一遍。muted 的那句话在 HTML 里。
    const bg = $('vbg');
    if (bg && bg.srcObject !== s) { bg.srcObject = s; bg.play().catch(() => {}); }
    if (ev.track.kind === 'video') {
      gotVideo = true;
      if (voiceTimer) { clearTimeout(voiceTimer); voiceTimer = null; }
      video.play().catch(() => { askToPlay(); });
      hidePanel();
      $('topBar').classList.remove('hide');
      $('ctlBar').classList.remove('hide');
      $('topRight').textContent = '画面已到';
    }
  };

  pc.onicecandidate = ev => {
    // 有信令通道了，可以随收随发（trickle）——不用再等收集完、把候选全塞进链接。
    if (ev.candidate) {
      send({ t: 'cand', cand: ev.candidate.candidate, mid: ev.candidate.sdpMid, mline: ev.candidate.sdpMLineIndex });
    }
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    $('topRight').textContent = s;
    if (s === 'failed') {
      // 分诊：信令通道还在 → 地址是真敲不通，那才是"连不上"，给换网络建议有意义；
      // 通道已经断了 → 媒体撑不住是必然结果，报对称 NAT 属于误诊。
      if (signalingAlive()) reportFailure('failed');
      else reportEnded('看不到画面了 · 与房主的连接先断了');
    }
    if (s === 'disconnected') $('topRight').textContent = '连接抖动，正在自愈';
    if (s === 'connected') {
      hidePanel();
      if (!voiceTimer) voiceTimer = setTimeout(enterVoiceModeIfNeeded, 2500);
    }
  };

  await pc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
  for (const c of pendingCands) { try { await pc.addIceCandidate(c); } catch (e) {} }
  pendingCands = [];

  // 观众也开麦（连麦）：浏览器侧的 AEC/NS/AGC 由 constraints 打开
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true },
      video: false,
    });
    micTrack = stream.getAudioTracks()[0];
    micTrack.enabled = false;          // 默认静音，点麦克风按钮才发言
    pc.addTrack(micTrack, stream);
  } catch (e) {
    $('btnMic').classList.add('hide'); // 拒绝麦克风不阻断观看
  }

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  send({ t: 'answer', sdp: pc.localDescription.sdp });
  startStats();
}

async function addRemoteCandidate(m){
  const c = { candidate: m.cand, sdpMid: m.mid, sdpMLineIndex: m.mline };
  if (!pc || !pc.remoteDescription) { pendingCands.push(c); return; }
  try { await pc.addIceCandidate(c); } catch (e) {}
}

/** 连上 2.5 秒仍无视频轨 → 房主开的是「仅语音」。给控件条、给收听入口，别让人对着黑屏等。 */
function enterVoiceModeIfNeeded(){
  if (!pc || pc.connectionState !== 'connected' || gotVideo) return;
  $('topBar').classList.remove('hide');
  $('ctlBar').classList.remove('hide');
  $('topRight').textContent = '语音模式';
  if (video.paused) askToPlay('语音模式', '对方只分享了声音，没有画面。点下面开始收听。');
}

/** 自动播放被浏览器拦下时的兜底入口（有声播放必须有用户手势）。 */
function askToPlay(title, body){
  show(`<h1>${escapeHtml(title || '画面已到')}</h1>
    <p class="muted">${escapeHtml(body || '浏览器的自动播放被拦住了，点一下开始。')}</p>
    <button class="primary" id="btnListen">开始播放</button>`);
  $('btnListen').onclick = () => video.play().then(hidePanel).catch(()=>{});
}

/**
 * 正常收场：房主结束分享，或信令通道先一步断掉。
 *
 * 刻意与 reportFailure 分开 —— 不催用户换网络、不说"没有中继兜底"，因为这一次
 * 什么都没坏，只是对方不播了。旧链接连同口令一起作废，所以不放「重试」：
 * 刷新只会再拿一个打不开的地址。
 *
 * 另外必须把顶部那颗绿色「● 直连」和底下还在跳 90ms/1fps 的控制岛一起收掉。
 * 上一版只换了面板，结果同一屏上三种说法并存：面板说"房主结束了分享"、
 * 顶栏说"直连"、右上说"连接抖动，正在自愈" —— 用户只会挑最刺眼的那条去理解，
 * 于是"结束"又被读成"卡住了"。
 */
function reportEnded(s){
  closedByUs = true;
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
  stopWatch();      // 广播源已经没了，同看条留着就是一根拔了线的音量键
  try { if (pc) pc.close(); } catch (e) {}
  const live = $('topBar').querySelector('.live');
  if (live) {
    live.innerHTML = '<i></i>已结束';
    live.style.color = 'var(--text-mid)';
    // 绿点是 .live 类给的，收场时换成灰的，否则"已结束"配绿灯自相矛盾
    const dot = live.querySelector('i');
    if (dot) { dot.style.background = 'var(--text-low)'; dot.style.boxShadow = 'none'; }
  }
  $('topRight').textContent = '分享已结束';
  $('ctlBar').classList.add('hide');
  show(`<h1>${escapeHtml(String(s))}</h1>
    <p class="muted">这次分享已经停了，不是你的网络问题。想看的话，得由房主在他手机上重新点一次「分享屏幕」，再把新链接发给你。</p>
    <p class="muted" style="margin-top:10px">这条链接连同口令已经一起作废，刷新也不会恢复。</p>${viewportNote()}`);
}

function reportFailure(s){
  closedByUs = true;
  // 画面到不了观众眼前，"一起看"就没有一起看的人了：条子收掉，别压在错误说明上面。
  // 房主那边的播放器不受影响 —— 这里停的只是这条**镜像**。
  stopWatch();
  show(`<h1>连不上房主的手机</h1>
    <p class="muted">网页能打开，<b>不代表画面一定连得通</b>。纯直连在部分网络下会失败，而且这一版没有中继兜底。</p>
    <div class="kv"><span>当前状态</span><span class="chip bad">${escapeHtml(String(s))}</span></div>
    <div class="row" style="margin-top:12px">
      <span class="chip">让房主先关掉 VPN 或代理</span>
      <span class="chip">你换成 WiFi 或换 5G 再点一次</span>
      <span class="chip">让房主重发一条链接</span>
    </div>
    <button class="primary" onclick="location.reload()">重试</button>${viewportNote()}`);
}

// ---- 统计 -------------------------------------------------------------

function startStats(){
  if (statsTimer) clearInterval(statsTimer);
  // 上一轮的累计计数。stats 里 inbound-rtp 的字节数与抖动缓冲延迟都是"从连接开始累加"
  // 的量，必须两次相减才是这一秒的实测值。
  let prev = null;
  statsTimer = setInterval(async () => {
    if (!pc) return;
    try {
      const st = await pc.getStats();
      let inbound = null, pair = null;
      st.forEach(r => {
        if (r.type === 'inbound-rtp' && r.kind === 'video') inbound = r;
        if (r.type === 'candidate-pair' && r.nominated) pair = r;
      });
      if (inbound) {
        // 码率与抖动缓冲都要**差分**，两个原因各不同：
        //  - Chrome 的 inbound-rtp 压根没有 `bitrate` 这个字段（那是 outbound 侧才有的），
        //    上一版写 `inbound.bitrate||0`，于是右上角永远显示 "0k" —— 看着像没流量。
        //  - `jitterBufferDelay / jitterBufferEmittedCount` 是**整个会话的累计均值**，
        //    跑得越久越钝：实测同一段连接它从 236ms 一路滑到 13ms，中间那次抖动尖峰
        //    全被平均值抹掉了。取两次之间的增量才看得懂"现在"的缓冲。
        let kbps = 0, jbMs = 0;
        const dt = prev ? (inbound.timestamp - prev.t) / 1000 : 0;
        if (dt > 0) {
          kbps = Math.round(Math.max(0, inbound.bytesReceived - prev.bytes) * 8 / dt / 1000);
          const emitted = inbound.jitterBufferEmittedCount - prev.emitted;
          if (emitted > 0) jbMs = 1000 * (inbound.jitterBufferDelay - prev.delay) / emitted;
        }
        prev = {
          t: inbound.timestamp,
          bytes: inbound.bytesReceived,
          delay: inbound.jitterBufferDelay,
          emitted: inbound.jitterBufferEmittedCount,
        };
        if (window.t2) window.t2.stats = {
          framesDecoded: inbound.framesDecoded,
          fps: inbound.framesPerSecond,
          width: inbound.frameWidth, height: inbound.frameHeight,
          kbps: kbps,
          jitterMs: +jbMs.toFixed(1),
          bytesReceived: inbound.bytesReceived,
          rttMs: pair && pair.currentRoundTripTime ? Math.round(pair.currentRoundTripTime * 1000) : null,
          connectionState: pc.connectionState,
          iceState: pc.iceConnectionState,
        };
        $('sFps').textContent = Math.round(inbound.framesPerSecond || 0);
        const rtt = pair && pair.currentRoundTripTime ? pair.currentRoundTripTime * 1000 : 0;
        const total = Math.round(jbMs + rtt / 2);
        $('sLat').textContent = total + 'ms';
        $('sNet').innerHTML = bars(total < 250 ? 4 : total < 400 ? 3 : total < 700 ? 2 : 1,
          total < 250 ? 'var(--live)' : total < 400 ? 'var(--warn)' : 'var(--err)') + ' 抖动+单程';
        $('topRight').textContent = `${inbound.frameWidth}×${inbound.frameHeight} · ${kbps}k`;
      }
    } catch (e) { /* 忽略瞬时统计失败 */ }
  }, 1000);
}

// ---- 控制条 -----------------------------------------------------------

$('btnMic').innerHTML = ICON.mute;
$('btnMic').onclick = () => {
  if (!micTrack) return;
  micOn = !micOn;
  micTrack.enabled = micOn;
  $('btnMic').innerHTML = micOn ? ICON.mic : ICON.mute;
  $('btnMic').classList.toggle('mic-live', micOn);
};
let volOn = true;
$('btnVol').innerHTML = ICON.vol;
$('btnVol').onclick = () => { volOn = !volOn; video.muted = !volOn; $('btnVol').innerHTML = volOn ? ICON.vol : ICON.mute2; };
$('btnPip').innerHTML = ICON.pip;
$('btnPip').onclick = async () => {
  try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); }
  catch (e) { /* Safari 可能走系统播控 */ }
};
$('btnFull').innerHTML = ICON.full;
$('btnFull').onclick = async () => {
  if (document.fullscreenElement) { try { await document.exitFullscreen(); } catch (e) {} return; }
  // 目标必须是 #stage，不是 documentElement：安卓上多数内核（Chrome/Edge/各家）
  // 只把 Fullscreen API 开给 <video>，对整个文档调用会直接 reject；
  // 上一版写成 `document.documentElement.requestFullscreen().catch(()=>{})`，
  // reject 被吞掉，用户看到的就是"点了全屏没任何反应"。
  const el = $('stage');
  const tried = [];
  try {
    if (el.requestFullscreen) { tried.push('stage'); await el.requestFullscreen({ navigationUI: 'hide' }); }
    else if (el.webkitRequestFullscreen) { tried.push('stage-webkit'); el.webkitRequestFullscreen(); }
    else throw new Error('no-element-api');
  } catch (e) {
    // 退一步：让视频自己进全屏（iOS Safari 与部分安卓内核只认这一条）
    try {
      if (video.webkitEnterFullscreen) { video.webkitEnterFullscreen(); tried.push('video-webkit'); }
      else throw new Error('no-video-api');
    } catch (e2) {
      toast('这个浏览器不让网页全屏（安卓上很常见）。' +
            '可以点旁边的画中画，或把手机横过来看。');
      return;
    }
  }
  // 有些内核 resolve 了但根本没进全屏，所以以 fullscreenElement 为准再判一次
  setTimeout(() => {
    if (!document.fullscreenElement) toast('浏览器拒绝了网页全屏，改用画中画试试');
  }, 400);
};
video.addEventListener('click', () => { if (video.paused) video.play(); });

// ---- 一起看（同看条） ---------------------------------------------------

/*
 * 房主在他手机 App 的内置浏览器里放片，每约 1 秒把播放器状态广播一条过来：
 *   房主→观众 {"t":"watch","f":"found|posMs|durMs|playing|allow|title"}
 *   观众→房主 {"t":"wcmd","f":"act|arg"}   act ∈ play|pause|seek|step
 * 这一条是房主那台播放器的**只读镜像** + 一根控制线。两件事决定了下面的全部写法：
 *  1. 不做本地乐观更新。按下 +10 之后进度一动不动，等下一次广播带回真相 ——
 *     两边永远只有一个进度，才不会演出"我这边跳了、他那边其实没动"这种更难解释的假象。
 *     反馈只在按钮上闪一下（.hit）。
 *  2. 权限的真正闸门在房主侧（CallSession 收消息时判 allow）。这里显示「仅观看」并置灰，
 *     是为了让人明白点了为什么没用，而不是为了拦住那条消息。
 *
 * 它走的是信令 WebSocket，跟 WebRTC 媒体通道无关 —— 画面还没通的时候房主可能已经在放片了，
 * 所以这条的显隐故意不看 pc.connectionState。
 */
const WATCH_STALE_MS = 5000;   // 一秒一条，5 秒没动静只有两种可能：他不播了，或关了页面
const WATCH_GAP_MS = 250;      // 连点保护：一次快进/快退要跨隧道跑一个来回
const WATCH_STEP_MS = 10000;

let watch = null;            // 最近一次解出来的房主播放器状态；null = 同看条不显示
let watchAt = 0;             // 最近一次收到广播的时刻 —— 判陈旧只认这一个时间戳
let watchTimer = null;
let lastWatchCmdAt = 0;

/** m:ss，过了一小时才写成 h:mm:ss。与房主侧 WatchSync.formatTime 同一套，别两边各写一个样。 */
function fmtClock(ms){
  if (!(ms > 0)) return '0:00';
  const total = Math.floor(ms / 1000);
  const s = total % 60, m = Math.floor(total / 60) % 60, h = Math.floor(total / 3600);
  const p = n => (n < 10 ? '0' + n : '' + n);
  return h > 0 ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
}

/* ── 放映厅 S 档：观众本地播同一条片源 ──────────────────────────────
   房主只递"哪条流 + 第几毫秒"，画面由观众自己取 —— 画质是原生的，
   也不再有两层 UI。取不到（跨域/签名过期/要会员）就撤掉这一层，
   退回看屏幕流，绝不留一个黑屏给观众。 */
let cine = null, cineHls = null, cineApplyUntil = 0, cineTimer = null;
let cineReady = false, cineWatch = null;
const lv = document.getElementById('lv'), lvBadge = document.getElementById('lvBadge'),
      cineBar = document.getElementById('cineBar');

function fmtMs(ms) {
  ms = Math.max(0, ms | 0);
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600),
        m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}
function runCute(fn) { try { fn(); } catch (e) {} }

function cineNote(msg) {
  const d = document.createElement('div');
  d.className = 'hint'; d.textContent = msg; d.style.top = 'auto'; d.style.bottom = '96px';
  document.getElementById('stage').appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

function onCinema(f) {
  if (!f) { cineDown('对方收了厅'); return; }
  const p = String(f).split('|');
  if (p.length < 10) return;
  const st = {
    ver: +p[0], url: p[1], kind: p[2], title: p[3], pos: +p[4], dur: +p[5],
    playing: p[6] === '1', rate: +p[7] || 1, hostWall: +p[8], allow: p[9] === '1',
  };
  if (!/^https?:\/\//i.test(st.url)) { cineDown('这条地址不能直接播'); return; }
  if (cine && st.ver < cine.ver) return;   // 乱序到达的旧状态：丢掉，别把进度倒回去
  const switched = !cine || cine.url !== st.url;
  cine = st;
  cineBar.classList.remove('hide');
  document.getElementById('watchBar').classList.add('hide');  // 一次只留一条横条
  if (switched) loadLocal(st); else syncLocal();
  paintCine();
}

function loadLocal(st) {
  stopLocalPlayer();
  cineReady = false;
  lv.classList.remove('hide'); lvBadge.classList.remove('hide');
  lvBadge.innerHTML = '本地播放 · <b>准备中…</b>';
  const isHls = /\.m3u8([?#]|$)/i.test(st.url) || st.kind === 'master';
  try {
    if (isHls) {
      if (window.Hls && Hls.isSupported()) {
        cineHls = new Hls({ enableWorker: true, lowLatencyMode: false });
        cineHls.loadSource(st.url);
        cineHls.attachMedia(lv);
        cineHls.on(Hls.Events.ERROR, (e, d) => {
          if (d && d.fatal) cineDown('这条流在观众这边取不到：' + (d.details || d.type));
        });
      } else if (lv.canPlayType('application/vnd.apple.mpegurl')) {
        lv.src = st.url;                     // Safari 原生能放 m3u8
      } else { cineDown('这个浏览器放不了 m3u8'); return; }
    } else {
      lv.src = st.url;
    }
  } catch (t) { cineDown('起播失败'); return; }
  lv.play().catch(() => {});
  if (!cineTimer) cineTimer = setInterval(syncLocal, 1000);
  /* 看门狗：光等 `error` 事件不够 —— 签名过期、被 CDN 静默限速、需要会员的站点，
     往往是不报错、就是不出画面。8 秒没首帧就自己退回屏幕流，
     否则观众对着一块黑以为是自己网卡。 */
  if (cineWatch) clearTimeout(cineWatch);
  cineWatch = setTimeout(() => {
    if (cine && !cineReady) cineDown('这条流 8 秒没出画面');
  }, 8000);
}

function stopLocalPlayer() {
  if (cineWatch) { clearTimeout(cineWatch); cineWatch = null; }
  cineReady = false;
  if (cineHls) { runCute(() => cineHls.destroy()); cineHls = null; }
  runCute(() => { lv.pause(); lv.removeAttribute('src'); lv.load(); });
  lv.classList.add('hide'); lvBadge.classList.add('hide');
}

function cineDown(reason) {
  stopLocalPlayer();
  if (cineTimer) { clearInterval(cineTimer); cineTimer = null; }
  cine = null;
  cineBar.classList.add('hide');
  if (reason) cineNote(reason + ' —— 退回看对方屏幕');
}

/** 每秒一次：把房主那条轴投影到本地，小偏差倍速追，大偏差才 seek。 */
function syncLocal() {
  if (!cine || lv.readyState < 2) return;
  const now = Date.now(), age = Math.max(0, now - cine.hostWall);
  const want = cine.playing ? cine.pos + age * (cine.rate || 1) : cine.pos;
  const drift = want - lv.currentTime * 1000;
  if (now < cineApplyUntil) { paintCine(drift); return; }  // 刚发过指令，先别抢方向盘
  if (Math.abs(drift) > 1200) {
    try { lv.currentTime = Math.max(0, want / 1000); } catch (e) {}
  } else if (Math.abs(drift) > 120 && cine.playing) {
    lv.playbackRate = Math.min(1.06, Math.max(0.94, 1 + drift / 1000 * 0.07));
  } else {
    lv.playbackRate = 1;
  }
  if (cine.playing && lv.paused) lv.play().catch(() => {});
  if (!cine.playing && !lv.paused) lv.pause();
  paintCine(drift);
}

function paintCine(drift) {
  if (!cine) return;
  document.getElementById('cTitle').textContent = cine.title || '一起看';
  const perm = document.getElementById('cPerm');
  perm.textContent = cine.allow ? '可控制' : '仅观看';
  perm.className = 'chip' + (cine.allow ? ' g' : '');
  document.getElementById('cPlay').textContent = cine.playing ? '❚❚' : '▶';
  /* 没出画面之前不报时间：显示一个"0:00 / 10:34"会让人以为进度坏了，
     其实只是还没接上；Δ 也一样 —— 没同步过时它是个几千毫秒的假数字。 */
  document.getElementById('cTime').textContent = cineReady
    ? fmtMs(lv.currentTime * 1000) + ' / ' + fmtMs(cine.dur || (lv.duration || 0) * 1000)
    : '正在接上这条片源…';
  const d = document.getElementById('cDrift');
  if (!cineReady) d.textContent = '';
  else if (typeof drift !== 'number' || Math.abs(drift) > 5000) d.textContent = '同步中';
  else d.textContent = 'Δ' + Math.round(drift) + 'ms';
  lvBadge.innerHTML = '本地播放 · <b>' +
    (lv.videoWidth ? lv.videoWidth + '×' + lv.videoHeight : '准备中…') + '</b>';
}

function sendCine(act) {
  if (!cine || !cine.allow) { cineNote('房主还没把方向盘交出来'); return; }
  cineApplyUntil = Date.now() + 800;   // 回声窗口：这 800ms 里不自动纠正
  send({ t: 'ccmd', f: act });
}
document.getElementById('cBack').onclick = () => sendCine('step|-10000');
document.getElementById('cFwd').onclick = () => sendCine('step|10000');
document.getElementById('cPlay').onclick = () => sendCine(cine && cine.playing ? 'pause' : 'play');
lv.addEventListener('loadedmetadata', () => {
  // 首帧出来才敢说"原生画质"：这一行是 S 档成没成的直接证据
  if (!lv.videoWidth) return;
  cineReady = true;
  console.log('CINEMA_LOCAL', lv.videoWidth + 'x' + lv.videoHeight, lv.duration);
  paintCine();
});
lv.addEventListener('error', () => { if (cine) cineDown('这条地址在观众这边取不到'); });

function onWatch(f){
  const p = String(f == null ? '' : f).split('|');
  // 字段不齐（老房主、半截消息）整条丢掉并把条收起来：猜出来的进度比没有进度更坏。
  if (p.length < 5) return setWatch(null);
  const pos = Number(p[1]), dur = Number(p[2]);
  if (!Number.isFinite(pos) || !Number.isFinite(dur)) return setWatch(null);
  // title 排在最后一段，带空格无所谓；真混进竖线时按房主侧一样的做法把余下拼回来。
  setWatch({ found: p[0] === '1', posMs: pos, durMs: dur,
             playing: p[3] === '1', allow: p[4] === '1',
             title: p.slice(5).join('|') });
  watchAt = Date.now();
  ensureWatchTimer();
}

function setWatch(s){
  watch = s;
  const bar = $('watchBar');
  if (!s) { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  $('wTitle').textContent = s.title || '一起看';
  const perm = $('wPerm');
  perm.textContent = s.allow ? '可控制' : '仅观看';
  perm.className = 'chip' + (s.allow ? ' ok' : '');
  // found=0（页面上没有 <video>）时说清"没找到播放器"，比摆三个按不动的键有用
  $('wKeys').classList.toggle('hide', !s.found);
  $('wMissing').classList.toggle('hide', !!s.found);
  $('wTime').textContent = fmtClock(s.posMs) + ' / ' + fmtClock(s.durMs);
  $('wPlay').textContent = s.playing ? '❚❚' : '▶';
  const dead = !s.allow || !s.found;
  $('wBack').disabled = dead; $('wPlay').disabled = dead; $('wFwd').disabled = dead;
}

function ensureWatchTimer(){
  if (watchTimer || document.hidden) return;
  watchTimer = setInterval(watchTick, 1000);
}
function stopWatchTimer(){ if (watchTimer) { clearInterval(watchTimer); watchTimer = null; } }
function watchTick(){
  if (!watchAt) return;
  if (Date.now() - watchAt > WATCH_STALE_MS) { watchAt = 0; stopWatchTimer(); setWatch(null); }
}
/** 分享结束时要一起收：否则留下一条控制条，指着的是一个已经不存在的播放器。 */
function stopWatch(){ watchAt = 0; lastWatchCmdAt = 0; stopWatchTimer(); setWatch(null); }

/* 切到后台就把定时器摘掉（移动端网页在后台本来就跑不动，留着只是白耗电），
   回到前台第一件事是**重新判一次陈旧** —— 被冻住的这几秒里房主早可能不播了。
   注意顺序：判完可能已经清零 watchAt，这时就别再把定时器挂回去（挂回去是个永不发作的空转）。 */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopWatchTimer(); return; }
  if (!watchAt) return;
  watchTick();
  if (watchAt) ensureWatchTimer();
});

function watchCmd(act, arg){
  const now = Date.now();
  if (now - lastWatchCmdAt < WATCH_GAP_MS) return false;
  lastWatchCmdAt = now;
  send({ t: 'wcmd', f: act + '|' + arg });
  return true;
}

/** 发指令 + 给一点"按到了"的回执。回执只落在按钮自己身上，进度一格都不本地改。 */
function watchPress(el, act, arg){
  if (!watch || !watch.allow || !watch.found) return;   // 注定被房主丢掉，别占掉那 250ms 窗口
  if (!watchCmd(act, arg)) return;                      // 被限流：什么都不闪，别装作动了
  el.classList.add('hit');
  clearTimeout(el._h);
  el._h = setTimeout(() => el.classList.remove('hit'), 300);
}

$('wBack').onclick = () => watchPress($('wBack'), 'step', -WATCH_STEP_MS);
$('wFwd').onclick  = () => watchPress($('wFwd'),  'step',  WATCH_STEP_MS);
// 读的是镜像里的 playing，而不是本地一个 toggle 变量：按下去之后图标也归房主下次广播翻。
$('wPlay').onclick = () => watchPress($('wPlay'), (watch && watch.playing) ? 'pause' : 'play', 0);
// seek（arg = 绝对毫秒）留着没接：这条上只有三个键，没有可拖的进度轨。
// 房主侧对 step 还会再夹一次（±120 秒、且夹在 [0, 时长] 内），所以这里不用自己算边界。

/* 让画面严格对齐"人眼看得见的那一块"。
   移动端有三套视口：布局视口（viewport meta 定的）、可见视口（visualViewport）、
   以及地址栏展开/收起时动态变化的那个。CSS 里任何 vh 用的都是**最大**的那个，
   于是地址栏一挡，画面底部就被裁掉一截，而 overflow:hidden 让这件事完全看不出来；
   部分国产内核还会把布局视口弄得比屏幕宽（页面缩放），右边跟着被切。
   visualViewport 是唯一直接给"看得见多大"的接口，所以拿它显式钉住舞台。 */
function fitStage(){
  const st = $('stage');
  const vv = window.visualViewport;
  if (!vv) return;                       // 老内核：退回 CSS 的 fixed inset:0
  st.style.left = vv.offsetLeft + 'px';
  st.style.top = vv.offsetTop + 'px';
  st.style.width = vv.width + 'px';
  st.style.height = vv.height + 'px';
}
fitStage();
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitStage);
  visualViewport.addEventListener('scroll', fitStage);
}
// 转屏时 visualViewport 的回调有时比布局稳定得晚，补一次
addEventListener('orientationchange', () => setTimeout(fitStage, 150));

/* 环境底只在宽屏开（理由见 CSS 里那段注释）。用 matchMedia 而不是自己量 innerWidth，
   分屏、缩放窗口、转屏都会由浏览器直接回调，不用我猜时机。 */
const wideQ = window.matchMedia ? window.matchMedia('(min-width: 700px)') : null;
function applyAmbient(){
  const on = !!(wideQ && wideQ.matches);
  $('stage').classList.toggle('ambient', on);
  // 关掉时把后景暂停：手机转成竖屏后它已经看不见了，没必要继续占合成开销
  const bg = $('vbg');
  if (bg) { if (on) { bg.play().catch(() => {}); } else { bg.pause(); } }
}
applyAmbient();
if (wideQ && wideQ.addEventListener) wideQ.addEventListener('change', applyAmbient);

/* 演示钩子：?demo=canvas 时挂一块**画出来的**竖屏画面，用来在没有房主的情况下
   检查观看端的呈现层（环境底有没有生效、居中的比例对不对、窄屏是不是真的关掉）。
   正常邀请链接不带这个参数，所以它不参与真实使用；但没有它，"打开就是全屏很丑"
   这类问题只能靠连上真房主才能复现，而隧道恰恰是最不稳定的一环。 */
if (DEMO) {
  const c = document.createElement('canvas'); c.width = 480; c.height = 900;
  const x = c.getContext('2d');
  const ds = c.captureStream(0);       // 0 = 不自动出帧，改由 requestFrame 驱动
  const trk = ds.getVideoTracks()[0];
  let t = 0;
  function drawFrame(){
    t += 1; x.fillStyle = '#101014'; x.fillRect(0, 0, 480, 900);
    for (let i = 0; i < 8; i++) {
      x.fillStyle = 'hsl(' + ((i * 40 + t * 6) % 360) + ' 70% 55%)';
      x.fillRect(24, 120 + i * 92, 432, 64);
    }
    x.fillStyle = '#fff'; x.font = 'bold 54px sans-serif'; x.fillText('PHONE', 130, 90);
    if (trk && trk.requestFrame) trk.requestFrame();
  }
  drawFrame();
  // 用 setInterval 而不是 rAF：headless Chrome 的 --virtual-time-budget 遇到 rAF 循环
  // 会永远追不完（实测整个进程挂死），定时器能被预算正常消耗掉。
  setInterval(drawFrame, 400);
  video.srcObject = ds; $('vbg').srcObject = ds;
  video.play().catch(() => {}); $('vbg').play().catch(() => {});
  hidePanel();
  $('topBar').classList.remove('hide'); $('ctlBar').classList.remove('hide');
}

/** 收场面板底部那行小字：把两套视口尺寸摊出来。
    观众用的是各种各样的手机浏览器，出问题只能靠截图反推 —— 让截图自带诊断。 */
function viewportNote(){
  const vv = window.visualViewport;
  const s = vv && vv.scale !== 1 ? ` · 缩放 ${vv.scale.toFixed(2)}` : '';
  return `<p class="muted" style="font-size:11px;opacity:.55;margin-top:14px">` +
    `布局 ${innerWidth}×${innerHeight} · 可见 ${vv ? Math.round(vv.width) + '×' + Math.round(vv.height) : '?'}${s}</p>`;
}

/** 轻量提示：不挡画面、2.6 秒自己走。全屏被拒这类事必须说出来，静默失败最招误解。 */
function toast(msg){
  let t = $('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:9;' +
      'max-width:86%;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.82);' +
      'color:#fff;font-size:12.5px;line-height:1.5;backdrop-filter:blur(8px);' +
      'border:1px solid rgba(255,255,255,.14);transition:opacity .25s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = '0'; }, 2600);
}

/* 仅调试：?report=1 时把统计 POST 回本地采集器，便于无头浏览器里取证。
   生产链接不带这个参数。 */
const _q = new URLSearchParams(location.search);
if (_q.get('report') === '1') {
  const RELAY = _q.get('relay') || '/report';
  setInterval(async () => {
    try {
      const payload = {
        at: Date.now(),
        conn: pc && pc.connectionState, ice: pc && pc.iceConnectionState,
        stats: window.t2 && window.t2.stats,
        panelHidden: $('panel').classList.contains('hide'),
        // 只报"面板出没出现"分不出"正常结束"和"连不上"这两类，而这次的缺陷恰恰是
        // 两者被混为一谈。把标题原文带回去，才看得见观众到底被说了什么。
        panelH1: ($('panel').querySelector('h1') || {}).textContent || null,
        // 画面被裁、全屏没反应这类问题，光看截图分不清是"视频框算错了"还是"视口本身
        // 比可见区域高"。把两套尺寸一起报回来：innerHeight 是布局视口，
        // visualViewport.height 是人眼真正看得到的那块，两者不等就是 100vh 的坑。
        geo: {
          iw: innerWidth, ih: innerHeight,
          vvh: window.visualViewport ? +window.visualViewport.height.toFixed(1) : null,
          vvw: window.visualViewport ? +window.visualViewport.width.toFixed(1) : null,
          osh: outerHeight,
          stageH: $('stage').clientHeight, stageW: $('stage').clientWidth,
          vidW: video.clientWidth, vidH: video.clientHeight,
          fit: getComputedStyle(video).objectFit,
          fs: !!document.fullscreenElement,
          // 面板溢出也用同一套数字判：cardL/cardW 与 innerWidth 一比就知道
          // 卡片是被居中挤小了，还是整个都跑到视口外面去了。
          cardL: +($('cardBody').getBoundingClientRect().left || 0).toFixed(1),
          cardW: +($('cardBody').getBoundingClientRect().width || 0).toFixed(1),
          docSW: document.documentElement.scrollWidth,
          bodySW: document.body.scrollWidth,
          // 能不能真的全屏：这个浏览器上 requestFullscreen 对谁有效，只能试了才知道
          fsOkOnStage: null,
        },
        video: { readyState: video.readyState, w: video.videoWidth, h: video.videoHeight,
                 t: +video.currentTime.toFixed(2) },
      };
      if (pc) {
        const st = await pc.getStats();
        const kinds = [];
        st.forEach(r => {
          if (r.type === 'outbound-rtp') kinds.push(`out:${r.kind} bytes=${r.bytesSent}`);
          if (r.type === 'inbound-rtp') kinds.push(`in:${r.kind} bytes=${r.bytesReceived} fps=${r.framesPerSecond}`);
        });
        payload.rtp = kinds;
      }
      await fetch(RELAY, { method: 'POST', body: JSON.stringify(payload) });
    } catch (e) { /* 采集器没起就算了，不影响观看 */ }
  }, 2000);
}

/* 演示模式不启动信令：没有 ?k= 本来也连不上，一路报错的卡片会盖住要检查的画面 */
if (!DEMO) boot();

/* 放映厅演示：?demo=canvas&cinema=1 —— 没有房主的情况下演一遍"已经按下开始放映"。
   它存在的唯一理由：观众端这一屏的层级（是不是真的只剩一层 UI）必须能在本地看到，
   而不是等一条隧道、一个会话、一次点击都齐了才发现压在一起。生产链接不带参数就不触发。 */
if (DEMO && new URLSearchParams(location.search).get('cinema')) {
  setTimeout(() => onCinema([
    1, 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'master',
    '《漫长的季节》第 3 集', 252_000, 634_000, 1, 1, Date.now(), 1,
  ].join('|')), 900);
}
