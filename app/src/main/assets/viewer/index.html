<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>双人票 · 观看</title>
<style>
:root{
  --surface-0:#121212; --surface-1:#181818; --surface-2:#1f1f1f;
  --text-hi:#fff; --text-mid:#b3b3b3; --text-low:#7a7a7a;
  --accent:#2997ff; --live:#1ed760; --err:#f3727f; --warn:#ffa42b;
  --scrim:rgba(0,0,0,.60);
  --r-lg:16px; --r-card:26px; --pill:9999px; --ctl:44px;
}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--text-hi);height:100vh;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
#stage{position:relative;width:100%;height:100%;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
/* 浮层：视频区之上只能用 scrim —— SurfaceView/原生视频内容抓不到，玻璃盖不上去 */
.overlay{position:absolute;left:12px;right:12px;z-index:5}
.top{top:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--pill);
  background:var(--scrim);font-size:12.5px;backdrop-filter:blur(10px)}
.top .live{display:inline-flex;align-items:center;gap:6px;color:var(--live)}
.top .live i{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(30,215,96,.2)}
.top .g{margin-left:auto;color:var(--text-mid)}
.bottom{bottom:20px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--pill);
  background:var(--scrim);justify-content:center;margin:0 auto;width:max-content;max-width:100%;
  backdrop-filter:blur(10px)}
.ctl{width:var(--ctl);height:var(--ctl);border-radius:var(--pill);display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.14);color:#fff;cursor:pointer;flex:none;
  transition:transform .12s cubic-bezier(.32,2.32,.61,.27),background .12s}
.ctl:active{transform:scale(.90,1.06)}
.ctl.on{background:#fff;color:#0a0a0a}
.ctl.mic-live{background:var(--live);color:#04160a}
.ctl svg{width:22px;height:22px}
.stat{display:flex;flex-direction:column;font-size:10.5px;color:var(--text-mid);line-height:1.25}
.stat b{font-size:12.5px;color:#fff;font-weight:640}
.sep{width:1px;height:26px;background:rgba(255,255,255,.18)}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:6}
.card{background:var(--surface-1);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-card);
  padding:20px;max-width:520px;width:100%;text-align:left;box-shadow:0 10px 28px rgba(0,0,0,.44)}
h1{font-size:20px;margin:0 0 6px}
.muted{color:var(--text-mid);font-size:13.5px;line-height:1.6}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:var(--pill);
  padding:13px 22px;font:inherit;font-weight:650;cursor:pointer;width:100%;margin-top:14px}
.chip{display:inline-flex;gap:5px;align-items:center;font-size:11px;padding:3px 9px;border-radius:var(--pill);
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);color:var(--text-mid);white-space:nowrap}
.chip.ok{color:#9be0ac;background:rgba(30,215,96,.13);border-color:rgba(30,215,96,.3)}
.chip.bad{color:#ffb4bb;background:rgba(243,114,127,.13);border-color:rgba(243,114,127,.32)}
.chip.warn{color:#ffd79a;background:rgba(255,164,43,.13);border-color:rgba(255,164,43,.32)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
.kv>*{min-width:0}
.hide{display:none!important}
.meter{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.meter i{width:3px;background:var(--live);border-radius:2px}
.steps{font-size:13px;color:var(--text-mid);line-height:1.9}
</style>
</head>
<body>
<div id="stage">
  <video id="v" autoplay playsinline></video>

  <div class="overlay top hide" id="topBar">
    <span class="live"><i></i>直连</span>
    <span class="g" id="topRight">等待画面…</span>
  </div>

  <div class="overlay bottom hide" id="ctlBar">
    <button class="ctl" id="btnMic" title="开麦连麦"></button>
    <div class="sep"></div>
    <div class="stat"><b id="sLat">—</b><span id="sNet">—</span></div>
    <div class="sep"></div>
    <div class="stat"><b id="sFps">—</b><span>fps</span></div>
    <div class="sep"></div>
    <button class="ctl" id="btnVol" title="音量"></button>
    <button class="ctl" id="btnPip" title="悬浮小窗"></button>
    <button class="ctl" id="btnFull" title="全屏"></button>
  </div>

  <div class="center" id="panel">
    <div class="card" id="cardBody"></div>
  </div>
</div>

<script>
/*
 * 观众端。与旧版最大的区别：**不再需要把链接发回给房主**。
 *
 * 旧版是"零服务器"——房主把 SDP 塞进链接，观众生成 answer 后还得人肉回传，
 * 一来一回 20–40 秒。现在房主手机里跑着一个传话员（本地 HTTP + WebSocket），
 * 由一条出站隧道挂到公网；这个页面连上那条 WebSocket，双方的 SDP 与候选
 * 就自己来回跑完了。用户只需要点一次链接。
 */

const STUN = [{ urls: [
  'stun:stun.hitv.com:3478',
  'stun:stun.chat.bilibili.com:3478',
  'stun:stun.miwifi.com:3478',
  'stun:stun.l.google.com:19302',
]}];

const ICON = {
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l16 16"/><path d="M9 5a3 3 0 0 1 6 0v5M6 11a6 6 0 0 0 9 5.2M12 17v4"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4h3l4 3V4L7 7H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>',
  mute2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4h3l4 3V4L7 7H4z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>',
  pip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11" width="7" height="6" rx="1.5" fill="currentColor" stroke="none"/></svg>',
  full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>',
};

const $ = id => document.getElementById(id);
const video = $('v');

let ws = null, pc = null, micTrack = null, micOn = false, statsTimer = null;
let gotVideo = false, voiceTimer = null;
/** 远端描述还没就绪时先攒着候选 —— 顺序错了 addIceCandidate 会抛错。 */
let pendingCands = [];
let closedByUs = false;

const KEY = new URLSearchParams(location.search).get('k') || '';

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(html){ $('cardBody').innerHTML = html; $('panel').classList.remove('hide'); }
function hidePanel(){ $('panel').classList.add('hide'); }
function bars(n, color){
  let s = '<span class="meter">';
  for (let i = 0; i < 4; i++) s += `<i style="height:${4+i*3}px;background:${i<n?color:'rgba(255,255,255,.22)'}"></i>`;
  return s + '</span>';
}

function send(obj){
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ---- 连接传话员 --------------------------------------------------------

function boot(){
  if (!KEY) {
    show(`<h1>这条链接不完整</h1>
      <p class="muted">邀请链接后面的 <code>?k=…</code> 是接入凭证。聊天软件经常把它折成卡片、
      或者只复制了前半截 —— 请让房主重新发一条完整的。</p>`);
    return;
  }
  show(`<h1>正在接入房主的手机…</h1>
    <p class="muted">画面和声音还是直接在两台设备之间传，不经任何中转。</p>
    <div class="row" style="margin-top:12px"><span class="chip" id="stChip">连接中</span></div>`);
  openSocket();
}

function openSocket(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws?k=${encodeURIComponent(KEY)}`;
  try { ws = new WebSocket(url); }
  catch (e) {
    show(`<h1>没能建立连接</h1><p class="muted">${escapeHtml(String(e))}</p>
      <button class="primary" onclick="location.reload()">重试</button>`);
    return;
  }

  ws.onopen = () => { send({ t: 'hello', role: 'viewer' }); };
  ws.onmessage = ev => { onMessage(ev.data); };
  ws.onclose = () => {
    if (closedByUs) return;
    reportFailure('与房主的连接断了');
  };
  ws.onerror = () => { /* onclose 会跟着触发，统一在那里处理 */ };
}

function onMessage(text){
  let m = null;
  try { m = JSON.parse(text); } catch (e) { return; }

  if (m.t === 'offer') startPeer(m.sdp);
  else if (m.t === 'cand') addRemoteCandidate(m);
  else if (m.t === 'bye') reportFailure('房主停止了分享');
}

// ---- 建立直连 ---------------------------------------------------------

async function startPeer(offerSdp){
  pc = new RTCPeerConnection({ iceServers: STUN, bundlePolicy:'max-bundle', rtcpMuxPolicy:'require' });
  // 调试钩子：模块作用域里的 pc 从外部读不到，量测需要能查连接状态与统计。
  window.t2 = { pc, video, stats: null, fail: null };

  pc.ontrack = ev => {
    // 音频视频都挂到同一个 <video> 上 —— 仅语音模式下声音也要能出来（video 元素可以只播音频）。
    let s = ev.streams[0];
    if (!s) {
      s = (video.srcObject instanceof MediaStream) ? video.srcObject : new MediaStream();
      s.addTrack(ev.track);
    }
    video.srcObject = s;
    if (ev.track.kind === 'video') {
      gotVideo = true;
      if (voiceTimer) { clearTimeout(voiceTimer); voiceTimer = null; }
      video.play().catch(() => { askToPlay(); });
      hidePanel();
      $('topBar').classList.remove('hide');
      $('ctlBar').classList.remove('hide');
      $('topRight').textContent = '画面已到';
    }
  };

  pc.onicecandidate = ev => {
    // 有信令通道了，可以随收随发（trickle）——不用再等收集完、把候选全塞进链接。
    if (ev.candidate) {
      send({ t: 'cand', cand: ev.candidate.candidate, mid: ev.candidate.sdpMid, mline: ev.candidate.sdpMLineIndex });
    }
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    $('topRight').textContent = s;
    if (s === 'failed') reportFailure('failed');
    if (s === 'disconnected') $('topRight').textContent = '连接抖动，正在自愈';
    if (s === 'connected') {
      hidePanel();
      if (!voiceTimer) voiceTimer = setTimeout(enterVoiceModeIfNeeded, 2500);
    }
  };

  await pc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
  for (const c of pendingCands) { try { await pc.addIceCandidate(c); } catch (e) {} }
  pendingCands = [];

  // 观众也开麦（连麦）：浏览器侧的 AEC/NS/AGC 由 constraints 打开
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true },
      video: false,
    });
    micTrack = stream.getAudioTracks()[0];
    micTrack.enabled = false;          // 默认静音，点麦克风按钮才发言
    pc.addTrack(micTrack, stream);
  } catch (e) {
    $('btnMic').classList.add('hide'); // 拒绝麦克风不阻断观看
  }

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  send({ t: 'answer', sdp: pc.localDescription.sdp });
  startStats();
}

async function addRemoteCandidate(m){
  const c = { candidate: m.cand, sdpMid: m.mid, sdpMLineIndex: m.mline };
  if (!pc || !pc.remoteDescription) { pendingCands.push(c); return; }
  try { await pc.addIceCandidate(c); } catch (e) {}
}

/** 连上 2.5 秒仍无视频轨 → 房主开的是「仅语音」。给控件条、给收听入口，别让人对着黑屏等。 */
function enterVoiceModeIfNeeded(){
  if (!pc || pc.connectionState !== 'connected' || gotVideo) return;
  $('topBar').classList.remove('hide');
  $('ctlBar').classList.remove('hide');
  $('topRight').textContent = '语音模式';
  if (video.paused) askToPlay('语音模式', '对方只分享了声音，没有画面。点下面开始收听。');
}

/** 自动播放被浏览器拦下时的兜底入口（有声播放必须有用户手势）。 */
function askToPlay(title, body){
  show(`<h1>${escapeHtml(title || '画面已到')}</h1>
    <p class="muted">${escapeHtml(body || '浏览器的自动播放被拦住了，点一下开始。')}</p>
    <button class="primary" id="btnListen">开始播放</button>`);
  $('btnListen').onclick = () => video.play().then(hidePanel).catch(()=>{});
}

function reportFailure(s){
  closedByUs = true;
  show(`<h1>连不上房主的手机</h1>
    <p class="muted">网页能打开，<b>不代表画面一定连得通</b>。纯直连在部分网络下会失败，而且这一版没有中继兜底。</p>
    <div class="kv"><span>当前状态</span><span class="chip bad">${escapeHtml(String(s))}</span></div>
    <div class="row" style="margin-top:12px">
      <span class="chip">让房主确认还在分享</span>
      <span class="chip">你换成 WiFi 再点一次</span>
      <span class="chip ok">最稳：连他开的热点</span>
    </div>
    <button class="primary" onclick="location.reload()">重试</button>`);
}

// ---- 统计 -------------------------------------------------------------

function startStats(){
  if (statsTimer) clearInterval(statsTimer);
  statsTimer = setInterval(async () => {
    if (!pc) return;
    try {
      const st = await pc.getStats();
      let inbound = null, pair = null;
      st.forEach(r => {
        if (r.type === 'inbound-rtp' && r.kind === 'video') inbound = r;
        if (r.type === 'candidate-pair' && r.nominated) pair = r;
      });
      if (inbound) {
        if (window.t2) window.t2.stats = {
          framesDecoded: inbound.framesDecoded,
          fps: inbound.framesPerSecond,
          width: inbound.frameWidth, height: inbound.frameHeight,
          kbps: Math.round((inbound.bitrate || 0) * 8 / 1000),
          jitterMs: +(1000 * inbound.jitterBufferDelay / Math.max(1, inbound.jitterBufferEmittedCount)).toFixed(1),
          rttMs: pair && pair.currentRoundTripTime ? Math.round(pair.currentRoundTripTime * 1000) : null,
          connectionState: pc.connectionState,
          iceState: pc.iceConnectionState,
        };
        $('sFps').textContent = Math.round(inbound.framesPerSecond || 0);
        const jb = ((inbound.jitterBufferDelay / Math.max(1, inbound.jitterBufferEmittedCount)) * 1000);
        const rtt = pair && pair.currentRoundTripTime ? pair.currentRoundTripTime * 1000 : 0;
        const total = Math.round(jb + rtt / 2);
        $('sLat').textContent = total + 'ms';
        $('sNet').innerHTML = bars(total < 250 ? 4 : total < 400 ? 3 : total < 700 ? 2 : 1,
          total < 250 ? 'var(--live)' : total < 400 ? 'var(--warn)' : 'var(--err)') + ' 抖动+单程';
        $('topRight').textContent = `${inbound.frameWidth}×${inbound.frameHeight} · ${Math.round((inbound.bitrate||0)*8/1000)}k`;
      }
    } catch (e) { /* 忽略瞬时统计失败 */ }
  }, 1000);
}

// ---- 控制条 -----------------------------------------------------------

$('btnMic').innerHTML = ICON.mute;
$('btnMic').onclick = () => {
  if (!micTrack) return;
  micOn = !micOn;
  micTrack.enabled = micOn;
  $('btnMic').innerHTML = micOn ? ICON.mic : ICON.mute;
  $('btnMic').classList.toggle('mic-live', micOn);
};
let volOn = true;
$('btnVol').innerHTML = ICON.vol;
$('btnVol').onclick = () => { volOn = !volOn; video.muted = !volOn; $('btnVol').innerHTML = volOn ? ICON.vol : ICON.mute2; };
$('btnPip').innerHTML = ICON.pip;
$('btnPip').onclick = async () => {
  try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); }
  catch (e) { /* Safari 可能走系统播控 */ }
};
$('btnFull').innerHTML = ICON.full;
$('btnFull').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
video.addEventListener('click', () => { if (video.paused) video.play(); });

/* 仅调试：?report=1 时把统计 POST 回本地采集器，便于无头浏览器里取证。
   生产链接不带这个参数。 */
const _q = new URLSearchParams(location.search);
if (_q.get('report') === '1') {
  const RELAY = _q.get('relay') || '/report';
  setInterval(async () => {
    try {
      const payload = {
        at: Date.now(),
        conn: pc && pc.connectionState, ice: pc && pc.iceConnectionState,
        stats: window.t2 && window.t2.stats,
        panelHidden: $('panel').classList.contains('hide'),
        video: { readyState: video.readyState, w: video.videoWidth, h: video.videoHeight,
                 t: +video.currentTime.toFixed(2) },
      };
      if (pc) {
        const st = await pc.getStats();
        const kinds = [];
        st.forEach(r => {
          if (r.type === 'outbound-rtp') kinds.push(`out:${r.kind} bytes=${r.bytesSent}`);
          if (r.type === 'inbound-rtp') kinds.push(`in:${r.kind} bytes=${r.bytesReceived} fps=${r.framesPerSecond}`);
        });
        payload.rtp = kinds;
      }
      await fetch(RELAY, { method: 'POST', body: JSON.stringify(payload) });
    } catch (e) { /* 采集器没起就算了，不影响观看 */ }
  }, 2000);
}

boot();
</script>
</body>
</html>
